<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Controls browser top bar color on mobile -->
    <meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <title>QBank — Adel Elzayat Question Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/AE-Logo.png" type="image/png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
</head>

<body>
    <nav class="navbar">
        <div class="navbar-brand" style="cursor:pointer" onclick="quizApp.goHomeFromBrand()" aria-label="Back to home">
            <img src="img/AE-Logo.png" alt="QBank logo" class="brand-logo">
            <div class="brand-text">
                <span class="brand-name">Adel Elzayat</span>
                <span class="brand-sub">Question Bank</span>
            </div>
        </div>
        <div class="navbar-actions">
            <label class="switch" aria-label="Toggle theme">
                <input type="checkbox" id="theme-checkbox" />
                <span class="slider">
                    <div class="star star_1"></div>
                    <div class="star star_2"></div>
                    <div class="star star_3"></div>
                    <svg viewBox="0 0 16 16" class="cloud_1 cloud">
                        <path transform="matrix(.77976 0 0 .78395-299.99-418.63)" fill="#fff" d="m391.84 540.91c-.421-.329-.949-.524-1.523-.524-1.351 0-2.451 1.084-2.485 2.435-1.395.526-2.388 1.88-2.388 3.466 0 1.874 1.385 3.423 3.182 3.667v.034h12.73v-.006c1.775-.104 3.182-1.584 3.182-3.395 0-1.747-1.309-3.186-2.994-3.379.007-.106.011-.214.011-.322 0-2.707-2.271-4.901-5.072-4.901-2.073 0-3.856 1.202-4.643 2.925"></path>
                    </svg>
                </span>
            </label>
            <button class="profile-icon-btn" onclick="quizApp.toggleLogoPanel()" aria-label="Profile">
                <span class="profile-icon">👤</span>
            </button>
        </div>
    </nav>

    <!-- Dedicated logo/account sidebar (opens when clicking the profile logo button) -->
    <aside class="logo-panel" id="logo-panel" aria-label="Account sidebar">
        <div class="logo-panel-header">
            <div class="logo-panel-title">
                <img src="img/AE-Logo.png" alt="QBank logo" class="logo-panel-logo">
                <span class="logo-panel-title-text">
                    <span class="logo-panel-kicker">QBank</span>
                    <h3>My Account</h3>
                </span>
            </div>
            <button type="button" class="logo-panel-close" onclick="quizApp.toggleLogoPanel()" aria-label="Close account sidebar">×</button>
        </div>
        <div class="logo-panel-body" id="logo-panel-body"></div>
    </aside>
    <div class="logo-panel-overlay" id="logo-panel-overlay" onclick="quizApp.toggleLogoPanel()" aria-hidden="true"></div>

    <div class="main-content">
        <div id="quiz-container">
            <div id="quiz-content">
                <div class="home-screen">
                    <h1>Select a quiz to begin</h1>
                </div>
            </div>
        </div>
    </div>
    <!-- Timed Quiz duration picker (bottom sheet on mobile / centered modal on desktop) -->
    <div class="ts-overlay" id="time-select-overlay" role="dialog" aria-modal="true" aria-labelledby="ts-title">
        <div class="ts-backdrop" onclick="quizApp.closeTimeSelection()"></div>
        <div class="ts-modal">
            <button type="button" class="ts-close" onclick="quizApp.closeTimeSelection()" aria-label="Cancel time selection">&times;</button>
            <div class="ts-header">
                <div class="ts-header-icon" aria-hidden="true">⏱️</div>
                <div class="ts-header-text">
                    <h2 id="ts-title">Choose your time</h2>
                    <p>Set how long you want for this quiz.</p>
                </div>
            </div>
            <div class="ts-readout">
                <div class="ts-num-wrap">
                    <span class="ts-num" id="ts-num">30</span>
                    <span class="ts-unit">minutes</span>
                </div>
                <span class="ts-equivalent" id="ts-equivalent">30 min</span>
            </div>
            <div class="ts-slider-block">
                <input type="range" id="ts-slider" class="ts-slider" min="10" max="300" step="1" value="30"
                       aria-label="Quiz duration in minutes"
                       oninput="quizApp.applyTimeSelection(parseInt(this.value, 10), 'slider')" />
                <div class="ts-scale" aria-hidden="true">
                    <span>10 min</span>
                    <span>≈ 2½ h</span>
                    <span>5 h</span>
                </div>
            </div>
            <div class="ts-section">
                <p class="ts-section-label">⚡ Quick select</p>
                <div class="ts-presets" id="ts-presets">
                    <button type="button" class="ts-chip" data-minutes="10" onclick="quizApp.applyTimeSelection(10, 'preset')">10m</button>
                    <button type="button" class="ts-chip" data-minutes="15" onclick="quizApp.applyTimeSelection(15, 'preset')">15m</button>
                    <button type="button" class="ts-chip" data-minutes="30" onclick="quizApp.applyTimeSelection(30, 'preset')">30m</button>
                    <button type="button" class="ts-chip" data-minutes="45" onclick="quizApp.applyTimeSelection(45, 'preset')">45m</button>
                    <button type="button" class="ts-chip" data-minutes="60" onclick="quizApp.applyTimeSelection(60, 'preset')">1h</button>
                    <button type="button" class="ts-chip" data-minutes="90" onclick="quizApp.applyTimeSelection(90, 'preset')">1h 30</button>
                    <button type="button" class="ts-chip" data-minutes="120" onclick="quizApp.applyTimeSelection(120, 'preset')">2h</button>
                    <button type="button" class="ts-chip" data-minutes="180" onclick="quizApp.applyTimeSelection(180, 'preset')">3h</button>
                    <button type="button" class="ts-chip" data-minutes="240" onclick="quizApp.applyTimeSelection(240, 'preset')">4h</button>
                    <button type="button" class="ts-chip" data-minutes="300" onclick="quizApp.applyTimeSelection(300, 'preset')">5h</button>
                </div>
            </div>
            <div class="ts-section">
                <p class="ts-section-label">⌨️ Or enter manually</p>
                <div class="ts-field">
                    <input type="text" id="ts-minutes-input" inputmode="numeric" pattern="[0-9]*" maxlength="3"
                           placeholder="30" autocomplete="off" enterkeyhint="done"
                           aria-describedby="ts-validation"
                           oninput="quizApp.handleDurationInput(this.value)"
                           onkeydown="if (event.key === 'Enter') { event.preventDefault(); quizApp.confirmTimeSelection(); }" />
                    <span class="ts-field-suffix">minutes</span>
                </div>
                <p class="ts-validation" id="ts-validation" role="alert" aria-live="polite"></p>
            </div>
            <div class="ts-actions">
                <button type="button" class="btn btn-secondary ts-cancel" onclick="quizApp.closeTimeSelection()">Cancel</button>
                <button type="button" class="btn ts-start" id="ts-start-btn" onclick="quizApp.confirmTimeSelection()">Start Quiz · 30 min <span class="ts-arrow">→</span></button>
            </div>
        </div>
    </div>
    <script src="quizData.js"></script>
    <script type="module">
        import { auth, db, collection, addDoc, query, where, orderBy, getDocs, serverTimestamp, signOut, onAuthStateChanged, ADMIN_EMAIL } from './firebase.js';

        let currentUser = null;
        let isAdmin = false;

        const QUIZ_STORAGE_KEY = "quiz_progress";

        const normalizeAnswer = (text) => {
            if (!text) return '';
            return text
                .toLowerCase()
                .trim()
                .replace(/[.,;:!?'"()\[\]{}]/g, '')
                .replace(/\s+/g, ' ');
        };

        const quizApp = {
            currentQuiz: null,
            currentQuestionIndex: 0,
            userAnswers: [],
            processedQuestions: [],
            selectedAnswer: null,
            quizAnswers: [],
            savedResultsData: [],
            questionAnswered: false,
            subjectBackIndex: null,

            isWrittenQuestion(question) {
                return question && (question.type === 'complete' || question.type === 'written');
            },

            getExpectedAnswers(question) {
                if (!question) return [];
                if (Array.isArray(question.correctAnswers)) return question.correctAnswers;
                if (Array.isArray(question.answers)) return question.answers;
                if (question.answer !== undefined) return [question.answer];
                if (Array.isArray(question.correctAnswer)) return question.correctAnswer;
                if (question.correctAnswer !== undefined) return [question.correctAnswer];
                return [];
            },

            getValidationMode(question) {
                if (!question) return 'ordered';
                if (question.orderMode === 'unordered') return 'unordered';
                if (question.validationMode === 'unordered') return 'unordered';
                return 'ordered';
            },

            isMultiWrittenQuestion(question) {
                return this.isWrittenQuestion(question) && this.getExpectedAnswers(question).length > 1;
            },

            hasWrittenSelection() {
                if (!this.selectedAnswer) return false;
                if (Array.isArray(this.selectedAnswer)) {
                    return this.selectedAnswer.length > 0 && this.selectedAnswer.every(answer => normalizeAnswer(answer) !== '');
                }
                return normalizeAnswer(this.selectedAnswer) !== '';
            },

            getMainButtonLabel(question) {
                if (this.isWrittenQuestion(question) && this.currentMode === 'normal' && !this.questionAnswered) {
                    return 'Enter';
                }
                return this.currentQuestionIndex === this.processedQuestions.length - 1 ? 'Finish' : 'Next';
            },

            escapeHtml(text) {
                if (!text) return '';
                return String(text)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            },

            async init() {
                this.initTheme();
                this.initAuth();
                this.checkUrlParams();
            },

            initAuth() {
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = {
                            uid: user.uid,
                            email: user.email,
                            displayName: user.displayName
                        };
                        isAdmin = user.email === ADMIN_EMAIL;
                    } else {
                        currentUser = null;
                        isAdmin = false;
                    }
                    this.updateLogoPanel();
                });
            },


            updateLogoPanel() {
                const bodyEl = document.getElementById('logo-panel-body');
                if (!bodyEl) return;

                const acctFooter = `
                        <div class="acct-footer">
                            <span class="acct-footer-icon" aria-hidden="true">🛡️</span>
                            <span>Your data is secure and private</span>
                        </div>
                    `;

                if (currentUser) {
                    bodyEl.innerHTML = `
                        <div class="acct-welcome-card">
                            <div class="acct-welcome-icon" aria-hidden="true">👋</div>
                            <div class="acct-welcome-text">
                                <div class="acct-welcome-title">Welcome back, ${currentUser.displayName || 'User'}!</div>
                                <div class="acct-welcome-sub">Nice to see you again. Pick up where you left off.</div>
                            </div>
                        </div>
                        <div class="acct-user-card">
                            <div class="acct-user-avatar" aria-hidden="true">👤</div>
                            <div class="acct-user-meta">
                                <div class="acct-user-name">${currentUser.displayName || 'User'}</div>
                                <div class="acct-user-sub">${currentUser.email}</div>
                            </div>
                            ${isAdmin ? '<span class="acct-status-badge acct-status-admin">Admin</span>' : '<span class="acct-status-badge">Member</span>'}
                        </div>
                        <div class="acct-actions">
                            <button type="button" class="acct-btn acct-btn-primary" onclick="quizApp.showResultsHistory()">
                                <span class="acct-btn-icon" aria-hidden="true">📊</span>
                                <span>My Results</span>
                            </button>
                            ${isAdmin ? '<button type="button" class="acct-btn acct-btn-admin" onclick="quizApp.showAdminPanel()"><span class="acct-btn-icon" aria-hidden="true">🛠</span><span>Admin Panel</span></button>' : ''}
                            <button type="button" class="acct-btn acct-btn-ghost" onclick="quizApp.logout()">
                                <span class="acct-btn-icon" aria-hidden="true">🚪</span>
                                <span>Logout</span>
                            </button>
                        </div>
                        ${acctFooter}
                    `;
                } else {
                    bodyEl.innerHTML = `
                        <div class="acct-welcome-card">
                            <div class="acct-welcome-icon" aria-hidden="true">✨</div>
                            <div class="acct-welcome-text">
                                <div class="acct-welcome-title">Welcome to QBank</div>
                                <div class="acct-welcome-sub">Sign in to save your progress, track your scores and unlock all features.</div>
                            </div>
                        </div>
                        <div class="acct-user-card">
                            <div class="acct-user-avatar" aria-hidden="true">👤</div>
                            <div class="acct-user-meta">
                                <div class="acct-user-name">Guest User</div>
                                <div class="acct-user-sub">Not signed in</div>
                            </div>
                            <span class="acct-status-badge">Guest</span>
                        </div>
                        <div class="acct-features-card">
                            <div class="acct-features-title">
                                <span class="acct-features-icon" aria-hidden="true">🔓</span>
                                <span>Sign in to unlock</span>
                            </div>
                            <ul class="acct-features-list">
                                <li><span class="acct-check" aria-hidden="true">✓</span><span>Save your progress &amp; results</span></li>
                                <li><span class="acct-check" aria-hidden="true">✓</span><span>Track your performance over time</span></li>
                                <li><span class="acct-check" aria-hidden="true">✓</span><span>Sync your results across devices</span></li>
                                <li><span class="acct-check" aria-hidden="true">✓</span><span>Review your past answers anytime</span></li>
                            </ul>
                        </div>
                        <a href="login.html" class="acct-btn acct-btn-google">
                            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="acct-google-icon" width="20" height="20" loading="lazy">
                            <span>Login with Google</span>
                        </a>
                        <div class="acct-divider"><span class="acct-divider-line"></span><span class="acct-divider-text">OR</span><span class="acct-divider-line"></span></div>
                        <button type="button" class="acct-btn acct-btn-outline" onclick="quizApp.toggleLogoPanel()">
                            <span class="acct-btn-icon" aria-hidden="true">👤</span>
                            <span>Continue as Guest</span>
                        </button>
                        ${acctFooter}
                    `;
                }
            },

toggleLogoPanel() {
                const panel = document.getElementById('logo-panel');
                const overlay = document.getElementById('logo-panel-overlay');
                if (panel && overlay) {
                    const isActive = panel.classList.toggle('active');
                    overlay.classList.toggle('active');
                    document.body.classList.toggle('logo-panel-open');
                    panel.setAttribute('aria-hidden', String(!isActive));
                    const btn = document.querySelector('.profile-icon-btn');
                    if (btn) btn.setAttribute('aria-expanded', String(isActive));
                }
            },

            // Navbar brand (AE logo + name): always navigate back to home
            goHomeFromBrand() {
                const panel = document.getElementById('logo-panel');
                if (panel && panel.classList.contains('active')) {
                    this.toggleLogoPanel();
                }
                this.goHome();
            },
            async logout() {
                try {
                    await signOut(auth);
                    currentUser = null;
                    isAdmin = false;
                    this.updateLogoPanel();
                } catch (error) {
                    console.error('Logout error:', error);
                }
            },

            checkUrlParams() {
                const params = new URLSearchParams(window.location.search);
                const quizId = params.get('quiz');

                if (quizId) {
                    const quiz = quizzes.find(q => q.id === quizId);
                    if (quiz) {
                        if (quiz.isSubjectGroup) {
                            this.showChapterSelection(quizzes.indexOf(quiz));
                            return;
                        }
                        const quizIndex = quizzes.indexOf(quiz);
                        this.startQuiz(quizIndex);
                        return;
                    }

                    for (const entry of quizzes) {
                        if (entry.isSubjectGroup && entry.chapters) {
                            const ch = entry.chapters.find(c => c.id === quizId);
                            if (ch) {
                                this.startQuiz(ch);
                                return;
                            }
                        }
                    }
                }

                this.renderHome();
            },

            initTheme() {
                const savedTheme = localStorage.getItem('quiz-theme') || 'light';
                document.documentElement.setAttribute('data-theme', savedTheme);
                
                // Sync the checkbox with saved theme
                // Checked (sun/cloud shown) = light mode, Unchecked (stars shown) = dark mode
                const checkbox = document.getElementById('theme-checkbox');
                if (checkbox) {
                    checkbox.checked = savedTheme === 'light';
                    checkbox.addEventListener('change', (e) => {
                        this.setTheme(e.target.checked ? 'light' : 'dark');
                    });
                }
            },

            setTheme(newTheme) {
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('quiz-theme', newTheme);
                
                // Update mobile browser top bar color
                const metaTheme = document.querySelector('meta[name="theme-color"]');
                if (metaTheme) {
                    metaTheme.content = newTheme === 'dark' ? '#1e293b' : '#ffffff';
                }
            },

            toggleTheme() {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                this.setTheme(newTheme);
                
                // Sync the checkbox
                const checkbox = document.getElementById('theme-checkbox');
                if (checkbox) {
                    checkbox.checked = newTheme === 'light';
                }
            },

            renderHome() {
                const content = document.getElementById('quiz-content');
                const cardIcons = ['📘', '🧠', '📐', '🌐', '⚖️', '🔬', '💼', '📡', '🧮', '🧬'];

                const cardsHtml = quizzes.map((quiz, index) => {
                    if (quiz.isSubjectGroup) {
                        const count = quiz.chapters ? quiz.chapters.length : 0;
                        return `
                            <div class="quiz-card subject-card" style="--card-i:${index}">
                                <div class="quiz-card-icon">📚</div>
                                <div class="quiz-card-title">${quiz.title}</div>
                                <div class="quiz-card-meta">
                                    <span class="meta-chip"><span class="chip-dot"></span>${count} quiz${count !== 1 ? 'zes' : ''}</span>
                                </div>
                                <button class="btn btn-primary" onclick="quizApp.showChapterSelection(${index})">Browse Quizzes</button>
                            </div>
                        `;
                    }
                    const timerMins = quiz.quizModeTimer ? Math.round(quiz.quizModeTimer / 60) : null;
                    return `
                        <div class="quiz-card" style="--card-i:${index}">
                            <div class="quiz-card-icon">${cardIcons[index % cardIcons.length]}</div>
                            <div class="quiz-card-title">${quiz.title}</div>
                            <div class="quiz-card-meta">
                                <span class="meta-chip"><span class="chip-dot"></span>${quiz.questions.length} questions</span>
                                ${timerMins ? `<span class="meta-chip">⏱ ${timerMins} min</span>` : ''}
                            </div>
                            <button class="btn btn-primary" onclick="quizApp.showModeSelection(${index})">Start Quiz</button>
                        </div>
                    `;
                }).join('');

                content.innerHTML = `
                    <div class="home-screen">
                        <header class="screen-header">
                            <span class="screen-kicker">✨ Prepare & Practice</span>
                            <h1>Question Bank</h1>
                            <p class="screen-subtitle">Choose a subject, pick a mode, and start practicing.</p>
                        </header>
                        <div class="quiz-grid">${cardsHtml}</div>
                    </div>
                `;

                window.history.replaceState({}, '', window.location.pathname);
            },

            showChapterSelection(subjectIndex) {
                const subject = quizzes[subjectIndex];
                const content = document.getElementById('quiz-content');

                const chapterCards = (subject.chapters || []).map((chapter, chIndex) => `
                    <div class="quiz-card" style="--card-i:${chIndex}">
                        <div class="quiz-card-icon">📖</div>
                        <div class="quiz-card-title">${chapter.title}</div>
                        <div class="quiz-card-meta">
                            <span class="meta-chip"><span class="chip-dot"></span>${chapter.questions.length} questions</span>
                        </div>
                        <button class="btn btn-primary" onclick="quizApp.showChapterModeSelection(${subjectIndex}, ${chIndex})">Start Quiz</button>
                    </div>
                `).join('');

                content.innerHTML = `
                    <div class="chapter-screen">
                        <div class="chapter-header">
                            <button class="btn-back" onclick="quizApp.goHome()">← <span>Back</span></button>
                            <h1>${subject.title}</h1>
                            <p>Pick a chapter to begin practicing</p>
                        </div>
                        <div class="quiz-grid">${chapterCards}</div>
                    </div>
                `;

                this.subjectBackIndex = subjectIndex;
                window.history.replaceState({}, '', window.location.pathname);
            },

            showChapterModeSelection(subjectIndex, chapterIndex) {
                const chapter = quizzes[subjectIndex].chapters[chapterIndex];
                this.currentQuiz = chapter;
                this.questionOrder = 'ordered';
                this.subjectBackIndex = subjectIndex;
                const content = document.getElementById('quiz-content');

                const totalQ = chapter.questions.length;
                const timerMins = chapter.quizModeTimer ? Math.round(chapter.quizModeTimer / 60) : null;

                content.innerHTML = `
                    <div class="mode-selection-screen">
                        <h1>${chapter.title}</h1>
                        <p>How would you like to take this quiz?</p>
                        <div class="order-selector">
                          <p class="order-selector-label">Question order</p>
                          <p class="order-selector-hint">This only arranges <strong>question order</strong> — your answer choices still shuffle as usual.</p>
                          <div class="order-options">
                            <button type="button" class="order-option ${this.questionOrder === 'ordered' ? 'active' : ''}" data-order="ordered" onclick="quizApp.selectQuestionOrder('ordered')" aria-pressed="${this.questionOrder === 'ordered'}">In Order</button>
                            <button type="button" class="order-option ${this.questionOrder === 'shuffle' ? 'active' : ''}" data-order="shuffle" onclick="quizApp.selectQuestionOrder('shuffle')" aria-pressed="${this.questionOrder === 'shuffle'}">🔀 Shuffle</button>
                          </div>
                        </div>
                        <div class="mode-cards">
                            <div class="mode-card normal-mode" onclick="quizApp.startQuiz(quizzes[${subjectIndex}].chapters[${chapterIndex}], 'normal')">
                                <div class="mode-icon">🎯</div>
                                <h3>Practice Mode</h3>
                                <p class="mode-card-desc">Learn as you go with instant feedback.</p>
                                <div class="mode-feature-list">
                                    <div class="mode-feature"><span class="tick">✓</span> See if your answer is correct right away</div>
                                    <div class="mode-feature"><span class="tick">✓</span> Review explanations question by question</div>
                                    <div class="mode-feature"><span class="tick">✓</span> ${totalQ} questions · ${timerMins ? `⏱ ${timerMins} min timed mode also available` : 'no time pressure'}</div>
                                </div>
                                <button class="btn btn-primary">Start Practice</button>
                            </div>
                            <div class="mode-card quiz-mode" onclick="quizApp.openTimeSelection(quizzes[${subjectIndex}].chapters[${chapterIndex}])">
                                <div class="mode-icon">⏱️</div>
                                <h3>Timed Quiz</h3>
                                <p class="mode-card-desc">Test yourself under real exam conditions.</p>
                                <div class="mode-feature-list">
                                    <div class="mode-feature"><span class="tick">✓</span> Countdown timer · you pick the duration</div>
                                    <div class="mode-feature"><span class="tick">✓</span> No feedback until you submit</div>
                                    <div class="mode-feature"><span class="tick">✓</span> ${totalQ} questions · full results at the end</div>
                                </div>
                                <button class="btn btn-danger">Start Timed Quiz</button>
                            </div>
                        </div>
                        <button class="btn btn-secondary mt-3" onclick="quizApp.showChapterSelection(${subjectIndex})">← Back to Chapters</button>
                    </div>
                `;
            },

            saveProgress() {
                if (!this.currentQuiz) return;
                const data = {
                    quizId: this.currentQuiz.id,
                    currentQuestionIndex: this.currentQuestionIndex,
                    userAnswers: this.userAnswers
                };

            loadProgress() {
                const saved = localStorage.getItem(QUIZ_STORAGE_KEY);
                if (!saved) return false;

                try {
                    const data = JSON.parse(saved);
                    if (!data.quizId || !this.currentQuiz) return false;
                    if (data.quizId !== this.currentQuiz.id) return false;

                    this.currentQuestionIndex = data.currentQuestionIndex || 0;
                    this.userAnswers = data.userAnswers || [];
                    this.selectedAnswer = this.userAnswers[this.currentQuestionIndex] || null;
                    this.questionAnswered = !!this.selectedAnswer;

                    return true;
                } catch (e) {
                    return false;
                }
            },

                localStorage.removeItem(QUIZ_STORAGE_KEY);
            },

            showModeSelection(quizIndex) {

            currentMode: 'normal',
            questionOrder: 'ordered',
            quizModeTimer: null,
            quizModeTimerInterval: null,
            QUIZ_MODE_STORAGE_KEY: "qbank_quizmode_",
            quizModeRemainingTime: null,
            quizModeTotalDuration: null,      // seconds — total selected duration, shown as "of MM:SS"
            userSelectedQuizDuration: null,   // seconds — set by the time picker, consumed by startQuizModeTimer()
