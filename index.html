                }
                this.applyTimeSelection(this.timeSelectionMinutes || 30, 'init');
                overlay.classList.add('active');
                document.body.classList.add('ts-open');
                this._tsEscHandler = (e) => { if (e.key === 'Escape') this.closeTimeSelection(); };
                document.addEventListener('keydown', this._tsEscHandler);
            },

            closeTimeSelection() {
                const overlay = document.getElementById('time-select-overlay');
                if (overlay) overlay.classList.remove('active');
                document.body.classList.remove('ts-open');
                if (this._tsEscHandler) {
                    document.removeEventListener('keydown', this._tsEscHandler);
                    this._tsEscHandler = null;
                }
                this.pendingTimedQuizRef = null;
            },

            formatDurationLabel(mins) {
                if (mins < 60) return `${mins} min`;
                const h = Math.floor(mins / 60);
                const m = mins % 60;
                return m === 0 ? `${h}h` : `${h}h ${m}m`;
            },

            applyTimeSelection(minutes, source = 'ui') {
                let value = Math.round(Number(minutes));
                if (!Number.isFinite(value)) return;
                value = Math.max(10, Math.min(300, value));
                const changed = value !== this.timeSelectionMinutes;
                this.timeSelectionMinutes = value;

                // Big animated readout
                const numEl = document.getElementById('ts-num');
                if (numEl) {
                    numEl.textContent = String(value);
                    if (changed && source !== 'init') {
                        numEl.classList.remove('pop');
                        void numEl.offsetWidth; // restart animation
                        numEl.classList.add('pop');
                    }
                }
                const equiv = document.getElementById('ts-equivalent');
                if (equiv) equiv.textContent = this.formatDurationLabel(value);

                // Slider + gradient fill
                const slider = document.getElementById('ts-slider');
                if (slider) {
                    slider.value = String(value);
                    slider.style.setProperty('--fill', (((value - 10) / 290) * 100).toFixed(2) + '%');
                }

                // Preset chips
                document.querySelectorAll('#ts-presets .ts-chip').forEach(chip => {
                    const isActive = Number(chip.dataset.minutes) === value;
                    chip.classList.toggle('active', isActive);
                    chip.setAttribute('aria-pressed', String(isActive));
                });

                // Manual input stays in sync
                const input = document.getElementById('ts-minutes-input');
                if (input && source !== 'input') input.value = String(value);

                const msg = document.getElementById('ts-validation');
                if (msg && source !== 'input') msg.classList.remove('visible');

                // CTA reflects the selection
                const cta = document.getElementById('ts-start-btn');
                if (cta) {
                    cta.disabled = false;
                    cta.innerHTML = `Start Quiz · ${this.formatDurationLabel(value)} <span class="ts-arrow">→</span>`;
                }
            },

            handleDurationInput(raw) {
                const inputEl = document.getElementById('ts-minutes-input');
                const cleaned = String(raw).replace(/[^0-9]/g, '').replace(/^0+(?=\d)/, '').slice(0, 3);
                if (inputEl && cleaned !== String(raw)) inputEl.value = cleaned;

                const msgEl = document.getElementById('ts-validation');
                const cta = document.getElementById('ts-start-btn');
                const fail = (msg) => {
                    if (msgEl) { msgEl.textContent = msg; msgEl.classList.add('visible'); }
                    if (cta) cta.disabled = true;
                };

                if (cleaned === '') { fail('Enter a duration between 10 and 300 minutes'); return; }
                const n = parseInt(cleaned, 10);
                if (n < 10) { fail('Minimum time is 10 minutes'); return; }
                if (n > 300) { fail('Maximum time is 300 minutes'); return; }

                if (msgEl) msgEl.classList.remove('visible');
                this.applyTimeSelection(n, 'input');
            },

            confirmTimeSelection() {
                const mins = this.timeSelectionMinutes;
                if (!Number.isFinite(mins) || mins < 10 || mins > 300) return;
                const ref = this.pendingTimedQuizRef;
                this.userSelectedQuizDuration = mins * 60;
                this.closeTimeSelection();
                this.startQuiz(ref, 'quiz');
            },

            
            startQuizModeTimer() {
                // Duration source: user's selection from the time picker (falls back to configured value)
                const timerValue = this.userSelectedQuizDuration || this.currentQuiz.quizModeTimer || 300;
                const savedTime = this.userSelectedQuizDuration
                    ? null
                    : localStorage.getItem(`qbank_quizmode_timer_${this.currentQuiz.id}`);
                if (this.userSelectedQuizDuration) {
                    // A fresh duration was chosen — discard any stale saved countdown
                    localStorage.removeItem(`qbank_quizmode_timer_${this.currentQuiz.id}`);
                }
                this.quizModeRemainingTime = savedTime ? parseInt(savedTime) : timerValue;
                // Remember the total so the capsule can display "of MM:SS" (resumed sessions
                // keep the larger of the configured value and the saved remainder)
                this.quizModeTotalDuration = savedTime
                    ? Math.max(timerValue, parseInt(savedTime))
                    : timerValue;

                const timerEl = document.getElementById('quiz-mode-timer');
                if (!timerEl) return;

                // Show the timer capsule (it lives inside the header nav row; CSS controls layout)
                const wrapper = document.getElementById('quiz-timer-wrapper');
                if (wrapper) wrapper.style.display = '';

                if (this.quizModeTimerInterval) {
                    clearInterval(this.quizModeTimerInterval);
                }

                this.updateTimerDisplay();

                this.quizModeTimerInterval = setInterval(() => {
                    this.quizModeRemainingTime--;
                    localStorage.setItem(`qbank_quizmode_timer_${this.currentQuiz.id}`, this.quizModeRemainingTime);
                    this.updateTimerDisplay();

                    if (this.quizModeRemainingTime <= 0) {
                        clearInterval(this.quizModeTimerInterval);
                        this.submitQuizMode();
                    }
                }, 1000);
            },

            updateTimerDisplay() {
                const timerEl = document.getElementById('quiz-mode-timer');
                if (!timerEl || this.quizModeRemainingTime == null) return;

                const remaining = Math.max(0, Number(this.quizModeRemainingTime) || 0);
                const mins = String(Math.floor(remaining / 60)).padStart(2, '0');
                const secs = String(remaining % 60).padStart(2, '0');

                const remainEl = timerEl.querySelector('.quiz-timer-remaining');
                if (remainEl) remainEl.textContent = `${mins}:${secs}`;

                // Total duration (dynamically reflects the user's selected quiz duration)
                const total = Math.max(remaining, Number(this.quizModeTotalDuration) || 0);
                const tMins = String(Math.floor(total / 60)).padStart(2, '0');
                const tSecs = String(total % 60).padStart(2, '0');
                const totalEl = timerEl.querySelector('.quiz-timer-total');
                if (totalEl) totalEl.textContent = `of ${tMins}:${tSecs}`;

                // Visual states driven purely by the existing countdown value
                timerEl.classList.toggle('timer-low', remaining > 60 && remaining < 600);
                timerEl.classList.toggle('timer-critical', remaining <= 60);
            },

            submitQuizMode() {
                this.clearQuizModeProgress();
                this.showResults();
            },

            clearQuizModeProgress() {
                if (this.quizModeTimerInterval) {
                    clearInterval(this.quizModeTimerInterval);
                }
                localStorage.removeItem(`qbank_quizmode_timer_${this.currentQuiz.id}`);
                localStorage.removeItem(`${this.QUIZ_MODE_STORAGE_KEY}${this.currentQuiz.id}`);
            },

            saveQuizModeProgress() {
                if (!this.currentQuiz) return;
                const data = {
                    quizId: this.currentQuiz.id,
                    currentQuestionIndex: this.currentQuestionIndex,
                    userAnswers: this.userAnswers,
                    mode: 'quiz'
                };
                localStorage.setItem(`${this.QUIZ_MODE_STORAGE_KEY}${this.currentQuiz.id}`, JSON.stringify(data));
            },

            loadQuizModeProgress() {
                const saved = localStorage.getItem(`${this.QUIZ_MODE_STORAGE_KEY}${this.currentQuiz.id}`);
                if (!saved) return false;

                try {
                    const data = JSON.parse(saved);
                    if (!data.quizId || !this.currentQuiz) return false;
                    if (data.quizId !== this.currentQuiz.id) return false;

                    this.currentQuestionIndex = data.currentQuestionIndex || 0;
                    this.userAnswers = data.userAnswers || [];
                    this.selectedAnswer = this.userAnswers[this.currentQuestionIndex] || null;
                    this.questionAnswered = !!this.selectedAnswer;

                    return true;
                } catch (e) {
                    return false;
                }
            },

            selectQuestionOrder(order) {
                this.questionOrder = order;
                const buttons = document.querySelectorAll('.order-option');
                if (buttons) {
                    buttons.forEach((btn) => {
                        const isActive = btn.dataset.order === order;
                        btn.classList.toggle('active', isActive);
                        btn.setAttribute('aria-pressed', String(isActive));
                    });
                }
            },

            startQuiz(quizIndex, mode = 'normal') {
                // Support both numeric index (from regular quizzes) and object (from chapter quizzes)
                this.currentQuiz = typeof quizIndex === 'object' ? quizIndex : quizzes[quizIndex];
                this.currentMode = mode;
                this.resetState();
                this.processedQuestions = this.processQuestions(this.currentQuiz.questions);

                if (this.currentMode === 'quiz') {
                  this.loadQuizModeProgress();
                } else {
                  this.loadProgress();
                }

                this.selectedAnswer = this.userAnswers[this.currentQuestionIndex] || null;
                this.questionAnswered = !!this.selectedAnswer;

                this.renderQuiz();
                
                if (this.currentMode === 'quiz') {
                    this.startQuizModeTimer();
                } else {
                    // Hide timer wrapper for normal mode
                    const wrapper = document.getElementById('quiz-timer-wrapper');
                    if (wrapper) wrapper.style.display = 'none';
                }
            },

            resetState() {
                this.currentQuestionIndex = 0;
                this.userAnswers = [];
                this.selectedAnswer = null;
                this.quizAnswers = [];
                this.questionAnswered = false;
            },

            processQuestions(questions) {
                let processed = [...questions];

                if (this.questionOrder === 'shuffle') {
                    processed = this.fisherYatesShuffle(processed);
                }

                return processed.map(q => {
                    let processedQ = { ...q };
                    const shouldShuffle = q.shuffle !== undefined ? q.shuffle : (q.type === 'multiple' || q.type === 'true_false');
                    if (shouldShuffle && (q.type === 'multiple' || q.type === 'true_false')) {
                        processedQ.options = this.fisherYatesShuffle([...q.options]);
                    }
                    return processedQ;
                });
            },

            fisherYatesShuffle(array) {
                const shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            },

            renderQuiz() {
                const content = document.getElementById('quiz-content');
                const question = this.processedQuestions[this.currentQuestionIndex];

                let imageHTML = "";
                if (question.image && question.image.trim() !== "") {
                    imageHTML = `
                        <div class="question-image-container">
                            <img src="${question.image}" class="question-image" onerror="this.parentElement.style.display='none';" alt="Question image">
                        </div>
                    `;
                }

                // Timed quiz only: the compact timer capsule lives inside the header nav row
                let timerHTML = "";
                if (this.currentMode === 'quiz') {
                    timerHTML = `
                            <div id="quiz-timer-wrapper" class="quiz-timer-wrapper">
                                <div id="quiz-mode-timer" class="quiz-timer" role="timer" aria-label="Time remaining">
                                    <svg class="quiz-timer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <line x1="10" x2="14" y1="2" y2="2"></line>
                                        <line x1="12" x2="15" y1="13" y2="11"></line>
                                        <circle cx="12" cy="14" r="8"></circle>
                                    </svg>
                                    <span class="quiz-timer-text">
                                        <span class="quiz-timer-remaining">00:00</span>
                                        <span class="quiz-timer-total">of 00:00</span>
                                    </span>
                                </div>
                            </div>`;
                }

                                const modeLabel = this.currentMode === 'quiz' ? '⏱ Timed' : '🎯 Practice';
                const typeLabel = question.type === 'true_false' ? 'True / False' : (question.type === 'complete' || question.type === 'written') ? 'Written Answer' : 'Multiple Choice';

                content.innerHTML = `
                    <div class="quiz-header">
                        <div class="quiz-header-top">
                            <button class="btn-back" onclick="quizApp.goHome()" aria-label="Back to quizzes">← <span>Back</span></button>
                            ${timerHTML}
                            <h1 class="quiz-header-title">${this.currentQuiz.title}</h1>
                        </div>
                        <div class="quiz-progress-row">
                            <div class="quiz-meta-tags">
                                <span class="question-number-badge">Q ${this.currentQuestionIndex + 1}</span>
                                <span class="mode-badge ${this.currentMode === 'quiz' ? 'timed' : 'practice'}">${modeLabel}</span>
                                <span class="mode-badge ${this.currentMode === 'quiz' ? 'timed' : 'practice'}">${typeLabel}</span>
                            </div>
                            <div class="progress">Question ${this.currentQuestionIndex + 1}/${this.processedQuestions.length}</div>
                            <div class="progress-bar"><div id="progress-bar" class="progress-bar-fill" style="width: 0%"></div></div>
                        </div>
                    </div>
                    <div class="question-container">
                        <div class="question-card">
                            <div class="question-tagbar">
                                <span class="question-type">${typeLabel}</span>
                            </div>
                            ${imageHTML}
                            <div class="question-text">${question.question}</div>
                            ${this.renderOptions(question)}
                        </div>
                    </div>
                    <div class="quiz-footer">
                        <div class="quiz-footer-actions">
                            <button class="btn btn-secondary btn-footer" onclick="quizApp.shareQuiz()">
                                <span class="btn-icon">🔗</span><span>Share</span>
                            </button>
                            ${this.currentQuestionIndex > 0 ? '<button class="btn btn-secondary btn-footer" onclick="quizApp.prevQuestion()"><span class="btn-icon">←</span><span>Previous</span></button>' : ''}
                        </div>
                        <button id="next-btn" class="btn btn-primary btn-next" onclick="quizApp.handleNextButton()" ${!this.selectedAnswer ? 'disabled' : ''}>${this.getMainButtonLabel(question)}</button>
                    </div>
                `;

                const savedAnswer = this.userAnswers[this.currentQuestionIndex];
                if (savedAnswer !== undefined) {
                    if (this.isWrittenQuestion(question)) {
                        if (this.currentMode === 'normal') {
                            const isCorrect = this.checkAnswer(question, savedAnswer);
                            this.markWrittenFeedback(question, savedAnswer, isCorrect);
                        }
                    } else {
                        const options = document.querySelectorAll('.option');
                        if (this.currentMode === 'normal') {
                            const correctAnswers = Array.isArray(question.correctAnswer) ? question.correctAnswer : [question.correctAnswer];
                            const normalizedSaved = normalizeAnswer(savedAnswer);

                            options.forEach(option => {
                                const text = option.querySelector('.option-text').textContent;
                                const normalizedOptionText = normalizeAnswer(text);
                                const isCorrect = correctAnswers.some(correct => normalizeAnswer(correct) === normalizedOptionText);
                                const isWrong = normalizedOptionText === normalizedSaved && !isCorrect;

                                if (isCorrect) {
                                    option.classList.add('correct');
                                }
                                if (isWrong) {
                                    option.classList.add('wrong');
                                }
                                if (isCorrect || isWrong) {
                                    option.classList.add('disabled');
                                }
                            });
                        } else {
                            // QUIZ MODE - only show selected state, NO colors, NO locking
                            options.forEach(option => {
                                const text = option.querySelector('.option-text').textContent;
                                if (text === savedAnswer) {
                                    option.classList.add('selected');
                                }
                            });
                        }
                    }

                    this.questionAnswered = true;
                }

                this.updateProgressBar();
                this.enableNextButton();

                // Refresh the capsule instantly after re-render so the countdown
                // never flashes 00:00 between question navigations
                if (this.currentMode === 'quiz') {
                    this.updateTimerDisplay();
                }
            },

            renderOptions(question) {
                if (this.isWrittenQuestion(question)) {
                    const expectedAnswers = this.getExpectedAnswers(question);
                    const isAnswered = this.userAnswers[this.currentQuestionIndex] !== undefined;
                    const isCorrect = isAnswered ? this.checkAnswer(question, this.userAnswers[this.currentQuestionIndex]) : false;
                    const savedAnswer = this.userAnswers[this.currentQuestionIndex];

                    if (this.isMultiWrittenQuestion(question)) {
                        const values = Array.isArray(savedAnswer) ? savedAnswer : Array(expectedAnswers.length).fill('');
                        const inputFields = expectedAnswers.map((_, index) => `
                            <div class="multi-input-row">
                                <span class="multi-input-number">${index + 1}</span>
                                <input
                                    type="text"
                                    id="complete-answer-${index}"
                                    class="complete-answer-field"
                                    placeholder="Answer ${index + 1}"
                                    aria-label="Answer ${index + 1}"
                                    value="${this.escapeHtml(values[index] || '')}"
                                    oninput="quizApp.handleCompleteInput(event, ${index})"
                                    onkeydown="quizApp.handleMultiAnswerKeyDown(event, ${index}, ${expectedAnswers.length - 1})"
                                    ${isAnswered && this.currentMode === 'normal' ? 'disabled' : ''}>
                            </div>
                        `).join('');

                        return `
                            <div class="complete-input ${isAnswered && this.currentMode === 'normal' ? (isCorrect ? 'correct' : 'wrong') : ''}">
                                <div class="multi-complete-fields">
                                    ${inputFields}
                                </div>
                                <div id="written-feedback" class="written-feedback"></div>
                            </div>
                        `;
                    }

                    return `
                        <div class="complete-input ${isAnswered && this.currentMode === 'normal' ? (isCorrect ? 'correct' : 'wrong') : ''}">
                            <div class="input-wrapper">
                                <input
                                    type="text"
                                    id="complete-answer-0"
                                    class="complete-answer-field"
                                    placeholder="Type your answer..."
                                    aria-label="Answer"
                                    value="${this.escapeHtml(savedAnswer || '')}"
                                    oninput="quizApp.handleCompleteInput(event, 0)"
                                    onkeydown="if(event.key === 'Enter') quizApp.handleNextButton()"
                                    ${isAnswered && this.currentMode === 'normal' ? 'disabled' : ''}>
                            </div>
                            <div id="written-feedback" class="written-feedback"></div>
                        </div>
                    `;
                }

                const optionsHtml = question.options.map((option, index) => {
                    const isSelected = this.userAnswers[this.currentQuestionIndex] === option;
                    return `
                        <div class="option ${isSelected ? 'selected' : ''}" onclick="quizApp.handleAnswer('${option.replace(/'/g, "\\'")}')">
                            <span class="option-letter">${String.fromCharCode(65 + index)}</span>
                            <span class="option-text">${option}</span>
                            <span class="option-check" aria-hidden="true"></span>
                        </div>
                    `;
                }).join('');

                return `<div class="options">${optionsHtml}</div>`;
            },

            handleAnswer(answer) {
                if (this.currentMode === 'normal' && this.userAnswers[this.currentQuestionIndex] !== undefined) return;
                
                this.selectedAnswer = answer;
                this.userAnswers[this.currentQuestionIndex] = answer;
                
                if (this.currentMode === 'normal') {
                    
                    this.saveProgress();

                    const currentQuestion = this.processedQuestions[this.currentQuestionIndex];
                    const correctAnswers = Array.isArray(currentQuestion.correctAnswer)
                        ? currentQuestion.correctAnswer
                        : [currentQuestion.correctAnswer];
                    const normalizedAnswer = normalizeAnswer(answer);

                    const options = document.querySelectorAll('.option');
                    options.forEach(option => {
                        const text = option.querySelector('.option-text').textContent;
                        const normalizedOptionText = normalizeAnswer(text);

                        const isCorrect = correctAnswers.some(correct => normalizeAnswer(correct) === normalizedOptionText);
                        const isWrong = normalizedOptionText === normalizedAnswer && !isCorrect;

                        if (isCorrect) {
                            option.classList.add('correct');
                        }
                        if (isWrong) {
                            option.classList.add('wrong');
                        }
                        if (isCorrect || isWrong) {
                            option.classList.add('disabled');
                        }
                    });
                } else {
                    // QUIZ MODE - User can change answers freely, NO locking
                    this.saveQuizModeProgress();
                    
                    const options = document.querySelectorAll('.option');
                    options.forEach(option => {
                        option.classList.remove('selected');
                        const text = option.querySelector('.option-text').textContent;
                        if (text === answer) {
                            option.classList.add('selected');
                        }
                    });
                }

                this.questionAnswered = true;
                this.enableNextButton();
            },

            handleCompleteInput(event, index) {
                const value = event.target.value;
                const currentQuestion = this.processedQuestions[this.currentQuestionIndex];

                if (!this.isWrittenQuestion(currentQuestion)) return;

                if (this.isMultiWrittenQuestion(currentQuestion)) {
                    const expectedAnswers = this.getExpectedAnswers(currentQuestion);
                    const answers = Array.isArray(this.selectedAnswer) ? [...this.selectedAnswer] : Array(expectedAnswers.length).fill('');
                    answers[index] = value;
                    this.selectedAnswer = answers;

                    if (this.currentMode === 'quiz') {
                        const hasValue = answers.some(a => normalizeAnswer(a) !== '');
                        this.userAnswers[this.currentQuestionIndex] = hasValue ? answers : undefined;
                        this.saveQuizModeProgress();
                    }
                } else {
                    this.selectedAnswer = value;
                    if (this.currentMode === 'quiz') {
                        this.userAnswers[this.currentQuestionIndex] = value.trim() || undefined;
                        this.saveQuizModeProgress();
                    }
                }

                this.questionAnswered = false;
                this.enableNextButton();
            },

            handleWrittenSubmit() {
                this.handleNextButton();
            },

            handleMultiAnswerKeyDown(event, currentIndex, lastIndex) {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    if (currentIndex < lastIndex) {
                        // Focus on the next answer field
                        const nextField = document.getElementById(`complete-answer-${currentIndex + 1}`);
                        if (nextField) {
                            nextField.focus();
                        }
                    } else {
                        // This is the last field, submit the answer
                        this.handleNextButton();
                    }
                }
            },

            handleNextButton() {
                const currentQuestion = this.processedQuestions[this.currentQuestionIndex];
                if (this.isWrittenQuestion(currentQuestion) && this.currentMode === 'normal' && !this.questionAnswered) {
                    this.submitWrittenAnswer();
                    return;
                }
                this.nextQuestion();
            },

            submitWrittenAnswer() {
                const currentQuestion = this.processedQuestions[this.currentQuestionIndex];
                if (!this.isWrittenQuestion(currentQuestion)) return;
                if (!this.hasWrittenSelection()) return;

                let answerToSave = this.selectedAnswer;
                if (this.isMultiWrittenQuestion(currentQuestion)) {
                    answerToSave = this.selectedAnswer.map(answer => answer.trim());
                } else {
                    answerToSave = String(this.selectedAnswer).trim();
                }

                this.userAnswers[this.currentQuestionIndex] = answerToSave;
                this.saveProgress();
                this.questionAnswered = true;

                const isCorrect = this.checkAnswer(currentQuestion, answerToSave);
                this.markWrittenFeedback(currentQuestion, answerToSave, isCorrect);
                this.enableNextButton();
            },

            markWrittenFeedback(question, userAnswer, isCorrect) {
                const container = document.querySelector('.complete-input');
                if (container) {
                    container.classList.add(isCorrect ? 'correct' : 'wrong');
                }

                if (this.isMultiWrittenQuestion(question)) {
                    const expected = this.getExpectedAnswers(question).map(normalizeAnswer);
                    const remaining = [...expected];
                    const inputs = Array.from(document.querySelectorAll('.complete-answer-field'));

                    inputs.forEach((input, index) => {
                        const normalizedValue = normalizeAnswer(input.value || '');
                        let fieldCorrect = false;

                        if (this.getValidationMode(question) === 'ordered') {
                            fieldCorrect = normalizedValue === expected[index];
                        } else {
                            const matchIndex = remaining.findIndex(correct => correct === normalizedValue);
                            fieldCorrect = matchIndex !== -1;
                            if (fieldCorrect) {
                                remaining.splice(matchIndex, 1);
                            }
                        }

                        input.classList.toggle('correct', fieldCorrect);
                        input.classList.toggle('wrong', !fieldCorrect);
                        input.disabled = true;
                    });
                } else {
                    const input = document.querySelector('.complete-answer-field');
                    if (input) {
                        input.classList.toggle('correct', isCorrect);
                        input.classList.toggle('wrong', !isCorrect);
                        input.disabled = true;
                    }
                }

                this.showWrittenFeedback(isCorrect, question);

                const nextBtn = document.getElementById('next-btn');
                if (nextBtn) {
                    nextBtn.textContent = this.currentQuestionIndex === this.processedQuestions.length - 1 ? 'Finish' : 'Next';
                }
            },

            showWrittenFeedback(isCorrect, question) {
                const feedbackDiv = document.getElementById('written-feedback');
                if (!feedbackDiv) return;

                const correctAnswers = this.getExpectedAnswers(question);
                const displayCorrect = correctAnswers.length > 1
                    ? `<ul>${correctAnswers.map(answer => `<li>${this.escapeHtml(answer)}</li>`).join('')}</ul>`
                    : `<strong>${this.escapeHtml(correctAnswers[0])}</strong>`;

                feedbackDiv.className = `written-feedback ${isCorrect ? 'correct' : 'incorrect'}`;
                feedbackDiv.innerHTML = `
                    <div class="feedback-status ${isCorrect ? 'correct' : 'incorrect'}">
                        ${isCorrect ? '✓ Correct' : '✗ Incorrect'}
                    </div>
                    ${!isCorrect ? `<div class="correct-answer-text">${correctAnswers.length > 1 ? 'Correct answers:' : 'Correct answer:'} ${displayCorrect}</div>` : ''}
                    ${question.explanation ? `<div class="explanation">${this.escapeHtml(question.explanation)}</div>` : ''}
                `;
                feedbackDiv.style.display = 'block';
            },

            updateSelectedUI() {
                const options = document.querySelectorAll('.option');
                options.forEach(option => {
                    const optionText = option.querySelector('.option-text').textContent;
                    if (optionText === this.selectedAnswer) {
                        option.classList.add('selected');
                    } else {
                        option.classList.remove('selected');
                    }
                });
            },

            enableNextButton() {
                const nextBtn = document.getElementById('next-btn');
                if (!nextBtn) return;

                const currentQuestion = this.processedQuestions[this.currentQuestionIndex];
                let enabled = false;

                if (this.isWrittenQuestion(currentQuestion)) {
                    enabled = this.hasWrittenSelection();
                } else {
                    enabled = !!this.selectedAnswer;
                }

                nextBtn.disabled = !enabled;
            },

            nextQuestion() {
                const currentQuestion = this.processedQuestions[this.currentQuestionIndex];
                const isCorrect = this.checkAnswer(currentQuestion, this.selectedAnswer);
                this.quizAnswers.push({
                    question: currentQuestion.question,
                    answer: this.selectedAnswer,
                    isCorrect
                });

                if (this.currentQuestionIndex < this.processedQuestions.length - 1) {
                    this.currentQuestionIndex++;
                    this.selectedAnswer = this.userAnswers[this.currentQuestionIndex] || null;
                    this.questionAnswered = false;
                    this.saveProgress();
                    this.renderQuiz();
                } else {
                    this.clearProgress();
                    this.showResults();
                }
            },

            prevQuestion() {
                if (this.currentQuestionIndex > 0) {
                    this.currentQuestionIndex--;
                    this.selectedAnswer = this.userAnswers[this.currentQuestionIndex] || null;
                    this.saveProgress();
                    this.renderQuiz();
                }
            },

            updateProgressBar() {
                const progressBar = document.getElementById('progress-bar');
                if (progressBar) {
                    const progress = ((this.currentQuestionIndex + 1) / this.processedQuestions.length) * 100;
                    progressBar.style.width = progress + '%';
                }
            },

            calculateScore() {
                let correct = 0;
                this.processedQuestions.forEach((question, index) => {
                    const userAnswer = this.userAnswers[index];
                    if (this.checkAnswer(question, userAnswer)) {
                        correct++;
                    }
                });
                return {
                    score: correct,
                    total: this.processedQuestions.length,
                    percentage: Math.round((correct / this.processedQuestions.length) * 100)
                };
            },

            async showResults() {
                // Hide the timer wrapper when showing results
                const wrapper = document.getElementById('quiz-timer-wrapper');
                if (wrapper) wrapper.style.display = 'none';

                const results = this.calculateScore();
                const content = document.getElementById('quiz-content');

                let showScore = true;
                if (this.currentQuiz && this.currentQuiz.showScore !== undefined) {
                    showScore = this.currentQuiz.showScore;
                }

                let saveMessage = '';
                if (currentUser) {
                    await this.saveResult(results);
                    saveMessage = '<div class="save-message">Result saved to your history</div>';
                } else {
                    saveMessage = '<div class="guest-message">Login to save your results</div>';
                }

                let resultsMessage = 'Not bad — review the answers below.';
                if (showScore) {
                    if (results.percentage >= 85) {
                        resultsMessage = 'Excellent work! You nailed it.';
                    } else if (results.percentage >= 70) {
                        resultsMessage = 'Great job!';
                    } else if (results.percentage >= 50) {
                        resultsMessage = 'Good effort — keep practicing!';
                    } else {
                        resultsMessage = 'Let\'s review the answers below.';
                    }
                }

                const resultsHtml = `
                    <div class="results">
                        <h2>Quiz Complete!</h2>
                        ${showScore ? `
                        <div class="results-hero">
                            <div class="score-display" style="--p:${results.percentage}">
                                <div class="score-ring">
                                    <div class="score-ring-inner">
                                        <span class="score-number">${results.score}/${results.total}</span>
                                        <span class="score-percentage">${results.percentage}%</span>
                                    </div>
                                </div>
                                <div class="results-message">${resultsMessage}</div>
                            </div>
                        </div>
                        ` : ''}
                        ${showScore ? this.renderAnswerReview() : ''}
                        ${saveMessage}
                        <div class="results-buttons">
                            <button class="btn btn-secondary btn-hero" onclick="quizApp.goHome()">Back to Quizzes</button>
                            <button class="btn btn-primary btn-hero" onclick="quizApp.restartQuiz()">Restart Quiz</button>
                        </div>
                    </div>
                `;

                content.innerHTML = resultsHtml;
            },

            async saveResult(results) {
                if (!currentUser || !this.currentQuiz) return;

                try {
                    const quizData = this.processedQuestions.map((q, index) => ({
                        question: q.question,
                        type: q.type || 'multiple',
                        image: q.image || '',
                        options: Array.isArray(q.options) ? q.options : null,
                        userAnswer: this.userAnswers[index] || null,
                        correctAnswer: this.getExpectedAnswers(q),
                        isCorrect: this.checkAnswer(q, this.userAnswers[index])
                    }));

                    await addDoc(collection(db, 'results'), {
                        userId: currentUser.uid,
                        userEmail: currentUser.email,
                        quizId: this.currentQuiz.id,
                        quizTitle: this.currentQuiz.title,
                        score: results.score,
                        totalQuestions: results.total,
                        percentage: results.percentage,
                        quizData: quizData,
                        timestamp: serverTimestamp()
                    });
                } catch (error) {
                    console.error('Error saving result:', error);
                }
            },

            renderAnswerReview() {
                const reviewHtml = this.processedQuestions.map((question, index) => {
                    const userAnswer = this.userAnswers[index];
                    const isCorrect = this.checkAnswer(question, userAnswer);
                    const expectedAnswers = this.getExpectedAnswers(question);

                    // Handle multi-answer questions with numbered format
                    if (this.isMultiWrittenQuestion(question)) {
                        const userAnswers = Array.isArray(userAnswer) ? userAnswer : Array(expectedAnswers.length).fill('');
                        
                        const userAnswerHtml = expectedAnswers.map((_, answerIndex) => `
                            <div class="multi-input-row">
                                <span class="multi-input-number">${answerIndex + 1}</span>
                                <span class="answer ${this.checkAnswerAtIndex(question, userAnswers, answerIndex) ? 'correct' : 'incorrect'}">
                                    ${this.escapeHtml(userAnswers[answerIndex] || 'No answer')}
                                </span>
                            </div>
                        `).join('');

                        const correctAnswerHtml = !isCorrect ? expectedAnswers.map((correctAns, answerIndex) => `
                            <div class="multi-input-row">
                                <span class="multi-input-number">${answerIndex + 1}</span>
                                <span class="answer correct">${this.escapeHtml(correctAns)}</span>
                            </div>
                        `).join('') : '';

                        return `
                            <div class="answer-review ${isCorrect ? 'correct' : 'incorrect'}">
                                <div class="review-question">${index + 1}. ${question.question}</div>
                                <div class="review-answer">
                                    <span class="label">Your answer:</span>
                                    <div class="multi-answer-display">${userAnswerHtml}</div>
                                </div>
                                ${correctAnswerHtml ? `
                                    <div class="review-answer">
                                        <span class="label">Correct answer:</span>
                                        <div class="multi-answer-display">${correctAnswerHtml}</div>
                                    </div>
                                ` : ''}
                                ${question.explanation ? `
                                    <div class="explanation">${this.escapeHtml(question.explanation)}</div>
                                ` : ''}
                            </div>
                        `;
                    }

                    // Single answer questions
                    const userAnswerText = Array.isArray(userAnswer) ? userAnswer.filter(Boolean).join(', ') : userAnswer;
                    const displayCorrect = expectedAnswers[0];

                    return `
                        <div class="answer-review ${isCorrect ? 'correct' : 'incorrect'}">
                            <div class="review-question">${index + 1}. ${question.question}</div>
                            <div class="review-answer">
                                <span class="label">Your answer:</span>
                                <span class="answer ${isCorrect ? 'correct' : 'incorrect'}">${this.escapeHtml(userAnswerText || 'No answer')}</span>
                            </div>
                            ${!isCorrect ? `
                                <div class="review-answer">
                                    <span class="label">Correct answer:</span>
                                    <span class="answer correct">${this.escapeHtml(displayCorrect)}</span>
                                </div>
                            ` : ''}
                            ${question.explanation ? `
                                <div class="explanation">${this.escapeHtml(question.explanation)}</div>
                            ` : ''}
                        </div>
                    `;
                }).join('');

                return `<div class="answer-review-container">${reviewHtml}</div>`;
            },

            checkAnswerAtIndex(question, userAnswers, index) {
                const expectedAnswers = this.getExpectedAnswers(question).map(normalizeAnswer);
                const normalizedUserAnswer = normalizeAnswer(userAnswers[index] || '');
                
                if (this.getValidationMode(question) === 'ordered') {
                    return normalizedUserAnswer === expectedAnswers[index];
                } else {
                    return expectedAnswers.includes(normalizedUserAnswer);
                }
            },

            checkAnswer(question, userAnswer) {
                if (!userAnswer) return false;

                if (this.isWrittenQuestion(question)) {
                    const expectedAnswers = this.getExpectedAnswers(question).map(normalizeAnswer);

                    if (Array.isArray(userAnswer)) {
                        const normalizedAnswers = userAnswer.map(answer => normalizeAnswer(answer));
                        if (normalizedAnswers.length !== expectedAnswers.length) return false;

                        if (this.getValidationMode(question) === 'unordered') {
                            const remaining = [...expectedAnswers];
                            for (const answer of normalizedAnswers) {
                                const matchIndex = remaining.findIndex(correct => correct === answer);
                                if (matchIndex === -1) return false;
                                remaining.splice(matchIndex, 1);
                            }
                            return remaining.length === 0;
                        }

                        return normalizedAnswers.every((answer, index) => answer === expectedAnswers[index]);
                    }

                    return normalizeAnswer(userAnswer) === expectedAnswers[0];
                }

                const correctAnswers = Array.isArray(question.correctAnswer)
                    ? question.correctAnswer
                    : [question.correctAnswer];

                return correctAnswers.some(correct => userAnswer === correct);
            },

            restartQuiz() {
                this.clearProgress();
                this.currentQuestionIndex = 0;
                this.userAnswers = [];
                this.selectedAnswer = null;
                this.quizAnswers = [];
                this.questionAnswered = false;
                this.processedQuestions = this.processQuestions(this.currentQuiz.questions);
                this.renderQuiz();
            },

            goHome() {
                // Hide the timer wrapper
                const wrapper = document.getElementById('quiz-timer-wrapper');
                if (wrapper) wrapper.style.display = 'none';

                if (this.currentMode === 'quiz') {
                    // Clear Quiz Mode timer and progress
                    if (this.quizModeTimerInterval) {
                        clearInterval(this.quizModeTimerInterval);
                        this.quizModeTimerInterval = null;
                    }
                    localStorage.removeItem(`qbank_quizmode_timer_${this.currentQuiz.id}`);
                    localStorage.removeItem(`${this.QUIZ_MODE_STORAGE_KEY}${this.currentQuiz.id}`);
                } else {
                    // Normal Mode - keep existing behavior
                    this.clearProgress();
                }
                
                this.currentQuiz = null;
                this.resetState();
                this.processedQuestions = [];
                window.history.replaceState({}, '', window.location.pathname);
                this.renderHome();
            },

            async showResultsHistory() {
                // Close the profile/account sidebar if it's open
                const logoPanel = document.getElementById('logo-panel');
                if (logoPanel && logoPanel.classList.contains('active')) {
                    this.toggleLogoPanel();
                }

                if (!currentUser) {
                    alert('Please login to view your results');
                    return;
                }

                const isMobile = window.innerWidth <= 768;


                const modal = document.createElement('div');

                if (isMobile) {
                    modal.className = 'modal-overlay';
                    modal.setAttribute('onclick', 'quizApp.closeModal(event)');
                    modal.innerHTML = `
                        <div class="modal-content history-modal" onclick="event.stopPropagation()">
                            <div class="modal-header">
                                <h2>My Results</h2>
                                <button class="btn-close" onclick="quizApp.closeHistoryModal()">×</button>
                            </div>
                            <div class="modal-body">
                                <div id="history-loading" class="loading-text">Loading...</div>
                                <div id="history-content"></div>
                            </div>
                        </div>
                    `;
                } else {
                    modal.className = 'desktop-results-overlay';
                    modal.id = 'desktop-results-overlay';
                    modal.innerHTML = `
                        <div class="desktop-results-modal">
                            <div class="desktop-results-header">
                                <h2>My Results</h2>
                                <button class="btn-close" onclick="quizApp.closeDesktopResults()">×</button>
                            </div>
                            <div class="desktop-results-body">
                                <div id="history-loading" class="loading-text">Loading...</div>
                                <div id="history-content"></div>
                            </div>
                        </div>
                    `;
                }

                document.body.appendChild(modal);

                try {
                    const q = query(
                        collection(db, 'results'),
                        where('userId', '==', currentUser.uid),
                        orderBy('timestamp', 'desc')
                    );
                    const snapshot = await getDocs(q);

                    const loadingEl = document.getElementById('history-loading');
                    const contentEl = document.getElementById('history-content');

                    this.savedResultsData = [];

                    if (snapshot.empty) {
                        loadingEl.style.display = 'none';
                        contentEl.innerHTML = '<div class="empty-state">No results yet. Take a quiz to see your history!</div>';
                    } else {
                        loadingEl.style.display = 'none';
                        let html = '<div class="results-list">';
                        let index = 0;
                        snapshot.forEach((doc) => {
                            const data = doc.data();
                            this.savedResultsData[index] = data;
                            const date = data.timestamp ? new Date(data.timestamp.seconds * 1000).toLocaleString() : 'N/A';
                            html += `
                                <div class="result-item clickable" onclick="quizApp.showReview(${index})">
                                    <div class="result-info">
                                        <div class="result-title">${data.quizTitle}</div>
                                        <div class="result-date">${date}</div>
                                    </div>
                                    <div class="result-score">
                                        <span class="score-badge">${data.score}/${data.totalQuestions}</span>
                                        <span class="score-percent">${data.percentage}%</span>
                                    </div>
                                </div>
                            `;
                            index++;
                        });
                        html += '</div>';
                        contentEl.innerHTML = html;
                    }
                } catch (error) {
                    console.error('Error fetching results:', error);
                    document.getElementById('history-loading').style.display = 'none';
                    document.getElementById('history-content').innerHTML = '<div class="error-state">Failed to load results</div>';
                }
            },

            closeDesktopResults() {
                document.getElementById('desktop-results-overlay').remove();
            },

            closeAllModals() {
                const modals = document.querySelectorAll('.modal-overlay, .desktop-results-overlay');
                modals.forEach(modal => modal.remove());
            },

            showReview(resultIndex) {
                this.closeAllModals();
                const resultData = this.savedResultsData[resultIndex];
                if (!resultData || !resultData.quizData) {
                    alert('Unable to load review data');
                    return;
                }

                const content = document.getElementById('quiz-content');

                const questionsHtml = resultData.quizData.map((item, index) => {
                    const iconClass = item.isCorrect ? 'icon-correct' : 'icon-incorrect';
                    const icon = item.isCorrect ? '✔' : '✖';

                    // Multiple-choice / true-false questions: rebuild the exact quiz look
                    if (Array.isArray(item.options) && item.options.length) {
                        const correctAnswers = Array.isArray(item.correctAnswer) ? item.correctAnswer : [item.correctAnswer];
                        const userAnswerText = item.userAnswer == null ? '' : String(item.userAnswer);

                        let imageHTML = '';
                        if (item.image && item.image.trim() !== '') {
                            imageHTML = `
                                <div class="question-image-container">
                                    <img src="${item.image}" class="question-image" onerror="this.parentElement.style.display='none';" alt="Question image">
                                </div>
                            `;
                        }

                        const typeLabel = item.type === 'true_false' ? 'True / False' : (item.type === 'complete' || item.type === 'written') ? 'Written Answer' : 'Multiple Choice';

                        const optionsHtml = item.options.map((option, optIndex) => {
                            const normalizedOption = normalizeAnswer(option);
                            const isCorrectOption = correctAnswers.some(correct => normalizeAnswer(String(correct)) === normalizedOption);
                            const isUserChoice = userAnswerText !== '' && normalizeAnswer(userAnswerText) === normalizedOption;

                            const classes = ['option', 'disabled'];
                            if (isCorrectOption) classes.push('correct');
                            if (!isCorrectOption && isUserChoice) classes.push('selected', 'wrong');

                            return `
                                <div class="${classes.join(' ')}">
                                    <span class="option-letter">${String.fromCharCode(65 + optIndex)}</span>
                                    <span class="option-text">${option}</span>
                                    <span class="option-check" aria-hidden="true"></span>
                                </div>
                            `;
                        }).join('');

                        return `
                            <div class="review-card ${item.isCorrect ? 'correct' : 'incorrect'} review-question-card">
                                <div class="review-card-header">
                                    <span class="question-number">Question ${index + 1}</span>
                                    <span class="${iconClass}">${icon}</span>
                                </div>
                                <div class="question-tagbar"><span class="question-type">${typeLabel}</span></div>
                                ${imageHTML}
                                <div class="review-card-question">${item.question}</div>
                                <div class="options">${optionsHtml}</div>
                            </div>
                        `;
                    }

                    // Check if this is a multi-answer question
                    const isMultiAnswer = Array.isArray(item.userAnswer);
                    const correctAnswersArray = Array.isArray(item.correctAnswer) ? item.correctAnswer : (Array.isArray(item.correctAnswer) ? item.correctAnswer : [item.correctAnswer]);

                    let answerDisplay = '';
                    
                    if (isMultiAnswer) {
                        // Display multi-answer format with numbers - per-field coloring
                        const userAnswers = Array.isArray(item.userAnswer) ? item.userAnswer : [];
                        
                        const userAnswerHtml = correctAnswersArray.map((_, answerIndex) => {
                            const normalizedUser = normalizeAnswer(userAnswers[answerIndex] || '');
                            const normalizedCorrect = normalizeAnswer(correctAnswersArray[answerIndex] || '');
                            const isFieldCorrect = normalizedUser === normalizedCorrect;
                            return `
                                <div class="multi-input-row">
                                    <span class="multi-input-number">${answerIndex + 1}</span>
                                    <span class="answer-value ${isFieldCorrect ? 'correct' : 'incorrect'}">${userAnswers[answerIndex] || 'No answer'}</span>
                                </div>
                            `;
                        }).join('');

                        const correctAnswerHtml = !item.isCorrect ? correctAnswersArray.map((correctAns, answerIndex) => `
                            <div class="multi-input-row">
                                <span class="multi-input-number">${answerIndex + 1}</span>
                                <span class="answer-value correct">${correctAns}</span>
                            </div>
                        `).join('') : '';

                        answerDisplay = `
                            <div class="answer-row ${item.isCorrect ? 'correct' : 'incorrect'}">
                                <span class="answer-label">Your answer:</span>
                                <div class="multi-answer-display">${userAnswerHtml}</div>
                            </div>
                            ${correctAnswerHtml ? `
                            <div class="answer-row correct">
                                <span class="answer-label">Correct answer:</span>
                                <div class="multi-answer-display">${correctAnswerHtml}</div>
                            </div>
                            ` : ''}
                        `;
                    } else {
                        // Single answer format (existing)
                        const userAnswerDisplay = Array.isArray(item.userAnswer) ? item.userAnswer.join(', ') : (item.userAnswer || 'No answer');
                        const correctAnswerDisplay = Array.isArray(item.correctAnswer) ? item.correctAnswer.join(', ') : item.correctAnswer;
                        
                        answerDisplay = `
                            <div class="answer-row ${item.isCorrect ? 'correct' : 'incorrect'}">
                                <span class="answer-label">Your answer:</span>
                                <span class="answer-value ${item.isCorrect ? 'correct' : 'incorrect'}">${userAnswerDisplay}</span>
                            </div>
                            ${!item.isCorrect ? `
                            <div class="answer-row correct">
                                <span class="answer-label">Correct answer:</span>
                                <span class="answer-value correct">${correctAnswerDisplay}</span>
                            </div>
                            ` : ''}
                        `;
                    }

                    return `
                        <div class="review-card ${item.isCorrect ? 'correct' : 'incorrect'}">
                            <div class="review-card-header">
                                <span class="question-number">Question ${index + 1}</span>
                                <span class="${iconClass}">${icon}</span>
                            </div>
                            <div class="review-card-question">${item.question}</div>
                            <div class="review-card-answers">
                                ${answerDisplay}
                            </div>
                        </div>
                    `;
                }).join('');

                content.innerHTML = `
                    <div class="review-page">
                        <div class="review-header">
                            <button class="btn-back" onclick="quizApp.goHome()">← Back to Quizzes</button>
                            <h1>${resultData.quizTitle}</h1>
                            <div class="review-score-summary">
                                <span class="review-score">${resultData.score}/${resultData.totalQuestions}</span>
                                <span class="review-percentage">${resultData.percentage}%</span>
                            </div>
                        </div>
                        <div class="review-questions">
                            ${questionsHtml}
                        </div>
                        <div class="review-footer">
                            <button class="btn btn-secondary" onclick="quizApp.goHome()">Back to Quizzes</button>
                        </div>
                    </div>
                `;
            },

            closeModal(event) {
                if (event.target.classList.contains('modal-overlay')) {
                    const modal = document.querySelector('.modal-overlay');
                    if (modal) modal.remove();
                }
            },

            closeHistoryModal() {
                const modal = document.querySelector('.modal-overlay');
                if (modal) modal.remove();
            },

            async showAdminPanel() {
                if (!isAdmin) return;

                const isMobile = window.innerWidth <= 768;


                const modal = document.createElement('div');

                if (isMobile) {
                    modal.className = 'modal-overlay';
                    modal.setAttribute('onclick', 'quizApp.closeModal(event)');
                    modal.innerHTML = `
                        <div class="modal-content admin-modal" onclick="event.stopPropagation()">
                            <div class="modal-header">
                                <h2>Admin Panel</h2>
                                <button class="btn-close" onclick="quizApp.closeHistoryModal()">×</button>
                            </div>
                            <div class="modal-body">
                                <div id="admin-loading" class="loading-text">Loading analytics...</div>
                                <div id="admin-content"></div>
                            </div>
                        </div>
                    `;
                } else {
                    modal.className = 'desktop-results-overlay';
                    modal.id = 'desktop-results-overlay';
                    modal.innerHTML = `
                        <div class="desktop-results-modal">
                            <div class="desktop-results-header">
                                <h2>Admin Panel</h2>
                                <button class="btn-close" onclick="quizApp.closeDesktopResults()">×</button>
                            </div>
                            <div class="desktop-results-body">
                                <div id="admin-loading" class="loading-text">Loading analytics...</div>
                                <div id="admin-content"></div>
                            </div>
                        </div>
                    `;
                }

                document.body.appendChild(modal);

                try {
                    const q = query(collection(db, 'results'), orderBy('timestamp', 'desc'));
                    const snapshot = await getDocs(q);

                    const loadingEl = document.getElementById('admin-loading');
                    const contentEl = document.getElementById('admin-content');

                    if (snapshot.empty) {
                        loadingEl.style.display = 'none';
                        contentEl.innerHTML = '<div class="empty-state">No quiz results yet.</div>';
                    } else {
                        loadingEl.style.display = 'none';

                        const quizStats = {};
                        const allResults = [];

                        snapshot.forEach((doc) => {
                            const data = doc.data();
                            allResults.push(data);

                            if (!quizStats[data.quizTitle]) {
                                quizStats[data.quizTitle] = {
                                    attempts: 0,
                                    totalScore: 0,
                                    quizId: data.quizId
                                };
                            }
                            quizStats[data.quizTitle].attempts++;
                            quizStats[data.quizTitle].totalScore += data.percentage;
                        });

                        let analyticsHtml = '<div class="analytics-section"><h3>Quiz Analytics</h3>';

                        for (const [title, stats] of Object.entries(quizStats)) {
                            const avgScore = Math.round(stats.totalScore / stats.attempts);
                            analyticsHtml += `
                                <div class="analytics-card">
                                    <div class="analytics-title">${title}</div>
                                    <div class="analytics-stats">
                                        <div class="stat">
                                            <span class="stat-value">${stats.attempts}</span>
                                            <span class="stat-label">Attempts</span>
                                        </div>
                                        <div class="stat">
                                            <span class="stat-value">${avgScore}%</span>
                                            <span class="stat-label">Avg Score</span>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }
                        analyticsHtml += '</div>';

                        let usersHtml = '<div class="users-section"><h3>All Results</h3>';
                        usersHtml += '<div class="results-list">';

                        allResults.slice(0, 50).forEach((data) => {
                            const date = data.timestamp ? new Date(data.timestamp.seconds * 1000).toLocaleDateString() : 'N/A';
                            usersHtml += `
                                <div class="result-item admin-result">
                                    <div class="result-info">
                                        <div class="result-user">${data.userEmail}</div>
                                        <div class="result-title">${data.quizTitle}</div>
                                        <div class="result-date">${date}</div>
                                    </div>
                                    <div class="result-score">
                                        <span class="score-badge">${data.score}/${data.totalQuestions}</span>
                                        <span class="score-percent">${data.percentage}%</span>
                                    </div>
                                </div>
                            `;
                        });

                        usersHtml += '</div></div>';
                        contentEl.innerHTML = analyticsHtml + usersHtml;
                    }
                } catch (error) {
                    console.error('Error fetching admin data:', error);
                    document.getElementById('admin-loading').style.display = 'none';
                    document.getElementById('admin-content').innerHTML = '<div class="error-state">Failed to load admin data</div>';
                }
            },

            shareQuiz() {
                const baseUrl = window.location.origin + window.location.pathname;
                const shareUrl = baseUrl + '?quiz=' + this.currentQuiz.id;

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(shareUrl).then(() => {
                        this.showShareNotification('Link copied!');
                    }).catch(() => {
                        this.showShareNotification('Failed to copy');
                    });
                } else {
                    const textArea = document.createElement('textarea');
                    textArea.value = shareUrl;
                    textArea.style.position = 'fixed';
                    textArea.style.left = '-9999px';
                    document.body.appendChild(textArea);
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        this.showShareNotification('Link copied!');
                    } catch (err) {
                        this.showShareNotification('Failed to copy');
                    }
                    document.body.removeChild(textArea);
                }
            },

            showShareNotification(message) {
                const notification = document.createElement('div');
                notification.className = 'share-notification';
                notification.textContent = message;
                notification.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary);color:white;padding:12px 24px;border-radius:8px;font-weight:500;z-index:9999;animation:fadeIn 0.3s ease;';
                document.body.appendChild(notification);

                setTimeout(() => {
                    notification.style.animation = 'fadeIn 0.3s ease reverse';
                    setTimeout(() => notification.remove(), 300);
                }, 2000);
            }
        };

        window.quizApp = quizApp;
        document.addEventListener('DOMContentLoaded', () => {
            quizApp.init();
        });
    </script>
</body>

</html>
